# Docker Compose Configuration for NBA API Service
# 
# This service depends on infrastructure from nba-realtime-service:
# - Redis: In-memory cache for game data
# - Redpanda: Kafka-compatible message broker
#
# Option 1: Use existing infrastructure from nba-realtime-service
#   cd ../nba-realtime-service && docker-compose up -d redis redpanda
#   Then run this service with: docker-compose up
#
# Option 2: Run everything together (includes Redis and Redpanda here)

version: "3.9"
services:
  # NBA API Service - REST API and WebSocket service
  nba-api-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"  # API server port
    env_file:
      - .env  # Load environment variables from .env file
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-redpanda:9092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-nba-api-service}
      - KAFKA_TOPIC_UPDATES=${KAFKA_TOPIC_UPDATES:-nba.game.updates}
      - KAFKA_CONSUMER_GROUP_ID=${KAFKA_CONSUMER_GROUP_ID:-nba-api-consumer-group}
      - API_PORT=${API_PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Redis cache (if not already running from nba-realtime-service)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Redpanda - Kafka-compatible message broker (if not already running from nba-realtime-service)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.2
    command:
      - redpanda start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"   # Kafka API port (internal Docker network)
      - "19092:19092" # External Kafka API port (for host access)
      - "9644:9644"   # Admin API port
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9644/v1/status/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

